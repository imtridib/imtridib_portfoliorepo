  <!-- Theme initialization -->
  <script>
    (function () {
      var t;
      try {
        t = localStorage.getItem("theme");
      } catch (e) { }

      document.documentElement.setAttribute(
        "data-theme",
        t === "light" ? "light" : "dark"
      );
    })();
  </script>

  <!-- Font optimization -->
